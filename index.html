@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2217;--card:#143222;--ink:#e6f4e4;--mut:#93b196;--line:#24472f;--acc:#7ddc4b;--on:#0d2217;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d2217;--card:#143222;--ink:#e6f4e4;--mut:#93b196;--line:#24472f;--acc:#7ddc4b;--on:#0d2217;color-scheme:dark}
html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
#root{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--mut)}.brand b{color:var(--ink);font-size:17px}
.lg{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(#7ddc4b,#3f9a2a);color:#fff;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--mut);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--acc);color:var(--on);font-weight:700}
.lk{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:#f5c451;color:#2b2100}
.bar b{margin-right:auto}.bar button{border:1px solid #2b2100;background:none;border-radius:8px;padding:5px 12px;color:#2b2100}.bar .pr{background:#2b2100;color:#f5c451}
.kb{flex:1;display:flex;min-height:0;position:relative}
.side{width:270px;flex:none;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.side input{margin:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.tl{overflow:auto;flex:1;padding:0 8px 12px}
.tl button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--ink)}
.tl button:hover{background:var(--bg)}.tl button.on{background:var(--acc);color:var(--on);font-weight:700}
.side .add{margin:0 12px 12px;padding:8px;border:1px dashed var(--acc);background:none;border-radius:8px}
.mp{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#0b1f14;color:#9dbb9f;font-size:13px}
.tb button{border:1px solid #2c5a3b;background:#143222;color:#d8f2d0;border-radius:8px;padding:4px 10px}.tb span{margin-left:auto}.tb .tp{display:none}
.vp{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle at 85% 0,#2f6b43 0,transparent 45%),linear-gradient(#17402a,#0f2a1b)}
.vp::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}.stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.nd{position:absolute;box-sizing:border-box;width:240px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;color:#e4f3df;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-left:4px solid #7ddc4b;cursor:default}
.nd b{color:#fff}.nd a{color:#b9f08f}.nd .tx{display:block;outline:0;word-break:break-word}.nd .tx[contenteditable=true]{cursor:text;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.25);padding:1px 3px}
.nd.root{width:300px;background:linear-gradient(#7ddc4b,#3f9a2a);border:2px solid #fff;color:#fff;font-weight:700;font-size:18px;text-align:center;border-radius:6px}

e scooter and tap \u003cb>Get Directions\u003c/b> to navigate to its location.", "f": "b"}, {"tbl": [["Area", "Manufacturer"], ["Alexandria, Heliopolis", "Kuickwheel, Yimi"], ["Downtown, Rehab, Mansoura, Helwan", "Kuickwheel, Navee"], ["Maadi", "Yimi, Navee"], ["Zahraa El Maadi", "Kuickwheel"]]}, {"t": "\u003cb>Note:\u003c/b> If we are operating in the area but there are \u003cb>no scooters available\u003c/b>, submit a \u003cb>Live Ops ticket\u003c/b> for redistribution."}], "g": "general", "b": "Ride Basics"}, {"t": "Referrals", "c": [{"t": "\u003cb>How to use it\u003c/b>", "f": "d", "h": 1, "c": [{"t": "Open the side menu in the app.", "f": "b"}, {"t": "Select \u003cb>Free Balance\u003c/b>.", "f": "b"}, {"t": "Tap \u003cb>Share Your Code\u003c/b> and send the referral link to your friends.", "f": "b"}, {"t": "Your friend must download the app using the shared link and complete their first paid ride.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b> You can share the referral link with up to 5 friends and earn 30 EGP for each successful referral."}]}, {"t": "\u003cb>Referral Balance Not Received\u003c/b>", "f": "d", "h": 1, "c": [{"t": "Request the referred user's phone number.", "f": "b"}, {"t": "Check the Dashboard to verify whether the referred user registered through the referral link.", "f": "b"}, {"t": "If the referral link was used, confirm that:", "f": "b", "c": [{"t": "The referred user has completed their \u003cb>first ride\u003c/b>.", "f": "l"}, {"t": "The ride was \u003cb>successfully paid\u003c/b>.", "f": "l"}, {"t": "The ride duration was \u003cb>more than 30 seconds\u003c/b> and is counted as a \u003cb>successful ride\u003c/b>.", "f": "l"}, {"t": "The referrer and referred user are \u003cb>not using the same device\u003c/b>.", "f": "l"}, {"t": "Neither account has any \u003cb>linked or deleted accounts\u003c/b>.", "f": "l"}, {"t": "Both accounts are \u003cb>active\u003c/b>, not deleted, and do not have a \u003cb>negative balance\u003c/b>.", "f": "l"}, {"t": "The referrer has \u003cb>not exceeded the maximum number of referral invitations\u003c/b>.", "f": "l"}]}, {"t": "If all eligibility criteria are met, manually credit the referral reward to both accounts.", "f": "b"}, {"t": "If the referral link was not used or any eligibility criteria are not met, educate the user on the correct referral process and requirements.", "f": "b"}]}], "g": "general", "b": "Promo Codes"}, {"t": "Reservation", "c": [{"t": "\u003cb>What’s the reservation\u003c/b>", "f": "d", "h": 1, "c": [{"t": "The reservation feature allows users to reserve a scooter before reaching it, preventing others from unlocking or using it.", "f": "b"}, {"t": "Reservation fees are:", "f": "b"}, {"t": "5 minutes: 9 EGP", "f": "l"}, {"t": "10 minutes: 12 EGP", "f": "l"}, {"t": "\u003cb>Note:\u003c/b> Prime subscribers can reserve scooters free of charge for up to 15 reservations."}]}, {"t": "\u003cb>How to reserve\u003c/b>", "f": "d", "h": 1, "c": [{"t": "Open the app and locate the nearest available scooter.", "f": "b"}, {"t": "Select the scooter and tap \u003cb>Reserve\u003c/b>.", "f": "b"}, {"t": "Choose the preferred reservation duration.", "f": "b"}, {"t": "Complete the payment to confirm the reservation.", "f": "b"}]}, {"t": "\u003cb>How to cancel/refund\u003c/b>", "f": "d", "h": 1, "c": [{"t": "There is no option to cancel a reservation from the system.", "f": "b"}, {"t": "Normally, the reservation amount is non-refundable, unless there is an issue with the scooter.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "If there is a location issue, the reservation amount can be refunded.", "f": "b"}, {"t": "If the user finds a nearby scooter instead: refund as a one-time exception and add a clear comment.", "f": "b"}, {"t": "If the user reserved the scooter by mistake: refund as a one-time exception and add a clear comment.", "f": "b"}]}]}], "g": "general", "b": "Ride Basics"}, {"t": "Can’t find the scooter", "c": [{"t": "Request the scooter code if it has not been provided by the user.", "f": "b"}, {"t": "Check the scooter's availability in the Dashboard.", "f": "b"}, {"t": "If the scooter is available, share its updated location and the latest scooter photo with the user.", "f": "b"}, {"t": "From the scooter page, click Ring to make the scooter emit a sound, helping the user locate it.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b>\u003cbr>If the \u003cb>Lat/Lng is 0\u003c/b>, share the \u003cb>location of the user's last ride\u003c/b> with the user and the \u003cb>Ops team\u003c/b>. If the scooter is still not found, \u003cb>disable the scooter\u003c/b> and update the Ops team."}], "g": "general", "b": "Ride Basics"}, {"t": "Total Number of Rides", "c": [{"t": "Check the user's total number of rides from the user page in the Dashboard.", "f": "b"}, {"t": "Guide the user on how to view their total rides in the app by navigating to Profile", "f": "b"}], "g": "general", "b": "Account & App"}, {"t": "Fraud", "c": [{"t": "\u003cb>Someone Else Used the Account or Started a Ride\u003c/b>", "f": "d", "h": 1, "c": [{"t": "Instruct the user to delete their account from the Profile tab. This will automatically sign them out of all devices.", "f": "b"}, {"t": "After the account is deleted, the user can create a new account using the same phone number.", "f": "b"}, {"t": "\u003cb>Notes:\u003c/b>", "h": 2, "c": [{"t": "If the user requests a refund for a ride made by someone else, inform them that, unfortunately, a refund is not available.", "f": "b"}, {"t": "If the user has a remaining balance, advise them to contact Customer Support after creating the new account so the balance can be transferred to the new account.", "f": "b"}]}]}, {"t": "\u003cb>Amount Deducted Without Starting a Ride\u003c/b>", "f": "d", "h": 1, "c": [{"t": "Request a screenshot from the user's banking app or digital wallet showing the transaction.", "f": "b", "c": [{"t": "The screenshot must clearly display the transaction \u003cb>date, time, and amount\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "Check the transaction history from the User page in the Dashboard and compare it with the screenshot.", "f": "b"}, {"t": "If the transaction is found, explain the reason for the deduction to the user.", "f": "b"}, {"t": "If the transaction is not found, ask the user whether the card may have been used on another account.", "f": "b"}, {"t": "If the transaction is still not found, advise the user to submit a complaint to their bank or digital wallet provider for further investigation.", "f": "b"}, {"t": "Advise the customer that they can \u003cb>remove their card from the app at any time\u003c/b>, and guide them through the steps to remove it.", "f": "b"}, {"t": "\u003cb>Note\u003c/b>: The deducted amount may be related to:", "c": [{"t": "Prime subscription.", "f": "b"}, {"t": "Auto Charge.", "f": "b"}, {"t": "The remaining balance of a previous ride.", "f": "b"}, {"t": "The minimum transaction amount required by the bank.", "f": "b"}]}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Complaint Follow-up", "c": [{"t": "Check the app to verify the complaint status and any available feedback.", "f": "b"}, {"t": "If the complaint has been submitted:", "f": "b", "c": [{"t": "If feedback is available, inform the user of the outcome.", "f": "d"}, {"t": "If no feedback is available yet, inform the user that the team will get back to them as soon as possible. Send the chat link via WhatsApp and mention the Team Leader.", "f": "d"}]}, {"t": "If no complaint has been submitted, inform the user that the team will get back to them as soon as possible and submit the complaint through the app.", "f": "b"}], "g": "general", "b": "Requests & Support"}, {"t": "Updating Account Information", "c": [{"t": "Users can only update their email address through the Profile section in the side menu.", "f": "b"}, {"t": "Phone numbers cannot be changed. If the user wants to use a different phone number, advise them to create a new account using the new number.", "f": "b"}, {"t": "Users can change the app language through the \u003cb>Side Menu\u003c/b> by selecting \u003cb>Language\u003c/b> and choosing their preferred language.", "f": "b"}], "g": "general", "b": "Account & App"}, {"t": "Tour inquiry (Grandfather)", "c": [{"t": "Inform the user that \u003cb>registration is free\u003c/b>.", "f": "b"}, {"t": "The \u003cb>minimum age requirement is 21\u003c/b>.", "f": "b"}, {"t": "Each participant must \u003cb>ride a scooter\u003c/b>.", "f": "b"}, {"t": "Users can \u003cb>sign up through the form in our Instagram bio\u003c/b>.", "f": "b"}, {"t": "If selected, \u003cb>our team will contact them with all the details\u003c/b>.", "f": "b"}], "g": "general", "b": "Requests & Support"}, {"t": "External Maintenance", "c": [{"t": "Collect the following information from the user:", "f": "b", "c": [{"t": "Scooter model.", "f": "b", "m": "o"}, {"t": "Description of the issue.", "f": "b", "m": "o"}, {"t": "Contact phone number.", "f": "b", "m": "o"}]}, {"t": "Submit the \u003cb>External Maintenance Request\u003c/b> form through the app.", "f": "b"}, {"t": "Inform the user that their request has been recorded.", "f": "b"}, {"t": "Advise the user that they will be contacted within \u003cb>2 weeks\u003c/b> regarding their maintenance request.", "f": "b"}], "g": "general", "b": "Requests & Support"}, {"t": "Pricing inquiry", "c": [{"t": "Ask the user for the scooter type and the area they plan to ride in.", "f": "b"}, {"t": "If the user provides both details, share the applicable pricing and guide them on where to find pricing information in the app.", "f": "b"}, {"t": "If the user does not provide the scooter type or area, share all available pricing options and explain how they can view the pricing in the app for future reference.", "f": "b"}, {"tbl": [["Area", "Standard Scooter", "Pro Scooter"], ["Downtown, Heliopolis, Alexandria, Helwan, Mansoura", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3/min\u003c/b>", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3.35/min\u003c/b>"], ["Maadi", "", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3.35/min\u003c/b>"], ["Zahraa El Maadi", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3/min\u003c/b>", ""], ["Rehab", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3.25/min\u003c/b>", "Unlock Fee: \u003cb>EGP 3\u003c/b>\u003cbr>Ride Cost: \u003cb>EGP 3.75/min\u003c/b>"]]}], "g": "general", "b": "Pricing"}, {"t": "Ride cost", "c": [{"t": "Ask the user which ride they are referring to if it has not been specified.", "f": "b"}, {"t": "Check the ride bill in the Dashboard and provide the user with the billing details.", "f": "b"}, {"t": "Explain the applicable pricing and how the ride fare was calculated.", "f": "b"}, {"t": "Guide the user on how to view the ride bill in the app by navigating to Side Menu &gt; Your Rides, then selecting the relevant ride.", "f": "b"}], "g": "general", "b": "Pricing"}, {"t": "Prepaid", "c": [{"t": "Inform the user that they must have a minimum balance \u003cb>of 30 EGP\u003c/b> available before starting each ride, even if they have a promo code applied.", "f": "b"}, {"t": "If the user is paying by card, explain the \u003cb>Auto Charge\u003c/b> feature and how it automatically charges the linked card when additional balance is required.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b> If the user requests a small balance top-up to start a ride, you can manually add \u003cb>up to 5 EGP\u003c/b> to the user's account."}], "g": "general", "b": "Pricing"}, {"t": "Payment Methods", "c": [{"t": "The following payment methods are currently supported:", "c": [{"t": "Debit cards", "f": "b"}, {"t": "Credit cards", "f": "b"}, {"t": "Meeza cards", "f": "b"}, {"t": "Telda cards", "f": "b"}, {"t": "International cards", "f": "b"}, {"t": "Digital wallets", "f": "b"}]}, {"t": "The following payment methods are \u003cb>not supported:\u003c/b>", "c": [{"t": "Neo (Mashreq Bank)", "f": "b"}, {"t": "Klivvr cards", "f": "b"}, {"t": "Vodafone Cash cards", "f": "b"}, {"t": "Egypt Post cards", "f": "b"}]}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "You cannot \u003cb>start a new ride\u003c/b> and then settle the negative balance using a bank card.", "f": "b"}, {"t": "If the transaction is processed through Paymob, all card types are accepted.", "f": "b"}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "How to charge/ add a payment method", "c": [{"t": "Ask the user which \u003cb>payment method\u003c/b> they will use, then provide the \u003cb>appropriate steps\u003c/b> accordingly."}, {"t": "\u003cb>Using an E-Wallet\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b> and select \u003cb>Wallet\u003c/b>.", "f": "b"}, {"t": "Tap \u003cb>Add Balance\u003c/b> and choose the package.", "f": "b"}, {"t": "Select \u003cb>Digital Wallet\u003c/b> as the payment method.", "f": "b"}, {"t": "Complete the payment process. You may receive a one-time password (OTP) to authorize the transaction.", "f": "b"}, {"t": "Once the payment is successful, tap \u003cb>Proceed\u003c/b>.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b> The account must be verified before proceeding\u003cb>.\u003c/b>"}]}, {"t": "\u003cb>Using a Card\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b> and select \u003cb>Wallet\u003c/b>.", "f": "b"}, {"t": "Tap \u003cb>Add Card\u003c/b>.", "f": "b"}, {"t": "Enter the card details.", "f": "b"}, {"t": "Tap \u003cb>Add Balance\u003c/b> and choose the package.", "f": "b"}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "How to remove the card", "c": [{"t": "Ask the user for the reason they want to remove the saved card and assist with any related issue, if applicable.", "f": "b"}, {"t": "If the user requests to remove the card, remove it from the User page in the Dashboard.", "f": "b"}, {"t": "Guide the user on how to remove a saved card in the app:", "f": "b", "c": [{"t": "Go to Side Menu → Wallet.", "f": "d"}, {"t": "Tap Edit.", "f": "d"}, {"t": "Select Remove Card.", "f": "d"}]}, {"t": "Notes:", "c": [{"t": "If the user is only asking how to remove a saved card, provide the in-app steps only.", "f": "b"}, {"t": "If the user requests to remove a card from \u003cb>another account\u003c/b>, we can verify ownership by asking for the \u003cb>last 4 digits of the card\u003c/b>.", "f": "b"}, {"t": "A saved card cannot be removed if:", "f": "b", "c": [{"t": "The account has a negative balance.", "f": "b", "m": "o"}, {"t": "A linked account has a \u003cb>negative balance\u003c/b>, and the user is either an \u003cb>abuser\u003c/b> or has \u003cb>more than 3 related accounts\u003c/b>.", "f": "b", "m": "o"}, {"t": "The account has an ongoing ride.", "f": "b", "m": "o"}]}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Auto charge", "c": [{"t": "Open the \u003cb>Side Menu\u003c/b> and select \u003cb>Wallet\u003c/b>.", "f": "d"}, {"t": "Locate the \u003cb>Auto Charge\u003c/b> feature.", "f": "d"}, {"t": "Enable or disable \u003cb>Auto Charge\u003c/b> based on your preference.", "f": "d"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "The \u003cb>Auto Charge\u003c/b> feature is available only for \u003cb>bank cards\u003c/b>.", "f": "b", "m": "o"}, {"t": "Auto Charge is \u003cb>not available\u003c/b> for \u003cb>customized packages\u003c/b>.", "f": "b", "m": "o"}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Settle a Negative Balance", "c": [{"t": "Open the \u003cb>Side Menu\u003c/b> and select \u003cb>Wallet\u003c/b>.", "f": "b"}, {"t": "Tap \u003cb>Settle\u003c/b>.", "f": "b"}, {"t": "Complete the payment process to clear the negative balance.", "f": "b"}, {"t": "Note: If the user is paying with a \u003cb>bank card\u003c/b>, you can settle the negative balance on the user's behalf."}], "g": "general", "b": "Payments & Wallet"}, {"t": "Balance Transfer", "c": [{"t": "Balance transfers are \u003cb>not supported\u003c/b>. However, the following exceptions apply:", "c": [{"t": "If the user has a \u003cb>linked account with a negative balance\u003c/b> that is no longer accessible, the balance may be transferred as an exception.", "f": "b"}, {"t": "If the user has a \u003cb>deleted account registered with the same phone number\u003c/b> that still contains a remaining balance, the balance may be transferred to the new account.", "f": "b"}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Check Wallet Balance", "c": [{"t": "Check the user's wallet balance from the \u003cb>User\u003c/b> page in the Dashboard and inform them of the available balance.", "f": "b"}, {"t": "Guide the user on how to view their wallet balance in the app by navigating to \u003cb>Side Menu → Wallet → History.\u003c/b>", "f": "b"}], "g": "general", "b": "Account & App"}, {"t": "Can’t add a card", "c": [{"t": "Ask the user for the \u003cb>card type\u003c/b> and \u003cb>issuing bank\u003c/b>, and verify that the card is supported.", "f": "b"}, {"t": "Confirm that the user has at least \u003cb>100 EGP\u003c/b> available in the account.", "f": "b"}, {"t": "Ask the user to try adding the card as an \u003cb>International Card\u003c/b>. If the issue persists, proceed to the next step.", "f": "b"}, {"t": "Advise the user to check with their bank to ensure the card is enabled for online transactions or to use an alternative supported payment method.", "f": "b"}, {"t": "\u003cb>Submit a ticket through the app\u003c/b> for further investigation.", "f": "b"}], "g": "general", "b": "Payments & Wallet"}, {"t": "Failed transaction", "c": [{"t": "\u003cb>1. Amount Not Deducted\u003c/b>", "h": 1, "c": [{"t": "Check the transaction \u003cb>Status\u003c/b> in the \u003cb>Transactions\u003c/b> tab of the Dashboard. It should show \u003cb>Failed\u003c/b>.", "f": "b"}, {"t": "Review the \u003cb>Instant/Last Gateway Message\u003c/b> to identify the reason for the failure.", "f": "b"}, {"t": "If the reason is clear, explain it to the user and provide the appropriate guidance.", "f": "b"}, {"t": "If the reason is unclear, advise the user to contact their bank or wallet provider for further assistance.", "f": "b"}]}, {"t": "\u003cb>2. Amount Deducted\u003c/b>", "h": 1, "c": [{"t": "\u003cb>Case 1: Status = Failed &amp; Instant/Last Gateway Message indicates a failure\u003c/b>", "h": 1, "c": [{"t": "Inform the user that the payment was unsuccessful and the deducted amount is likely being held by the bank or wallet provider.", "f": "b"}, {"t": "Advise the user to contact their bank or wallet provider for the refund timeline, as they can confirm when the held amount will be released.", "f": "b"}]}, {"t": "\u003cb>Case 2: Status = Success &amp; Last Gateway Message = Approved\u003c/b>", "h": 1, "c": [{"t": "Request a screenshot from the user's banking app or digital wallet showing the successful deduction.", "f": "b"}, {"t": "Verify the transaction details and manually credit the deducted amount to the user's wallet.", "f": "b"}, {"t": "\u003cb>Submit a Failed Transactions form\u003c/b> with the case details.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "If the transaction status is \u003cb>Failed\u003c/b>, the \u003cb>Instant Gateway Message\u003c/b> shows \u003cb>Approved\u003c/b>, and the \u003cb>Last Gateway Message\u003c/b> shows \u003cb>Unknown / None\u003c/b>, this means the transaction has been \u003cb>refunded\u003c/b>.", "f": "b"}]}]}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Pending transaction", "c": [{"t": "Request a screenshot from the user's banking app or digital wallet showing the successful payment.", "f": "b"}, {"t": "If the payment \u003cb>was deducted\u003c/b>:", "f": "b", "c": [{"t": "Manually credit the amount to the user's wallet.", "f": "b", "m": "o"}, {"t": "Submit a ticket through the app for further investigation.", "f": "b", "m": "o"}]}, {"t": "If the payment \u003cb>was not deducted\u003c/b>, advise the user to contact their bank or digital wallet provider for further assistance.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b> The screenshot must clearly show the \u003cb>transaction date, time, and amount\u003c/b>."}], "g": "general", "b": "Payments & Wallet"}, {"t": "Dispute", "c": [{"t": "If the user reports that their \u003cb>wallet balance has disappeared or been deducted\u003c/b>, follow these steps:", "c": [{"t": "Go to the \u003cb>User Page\u003c/b>.", "f": "d"}, {"t": "Open \u003cb>Wallet\u003c/b> and check the reason for the deduction.", "f": "d"}, {"t": "If the deduction is due to a \u003cb>Dispute\u003c/b>, inform the user accordingly.", "f": "d"}]}, {"t": "\u003cb>What does “Dispute” mean?\u003c/b>\u003cbr>A dispute occurs when the user raises a complaint with their bank \u003cb>to reverse a payment/transaction that was already used within the app\u003c/b>. As a result, the amount is deducted again from the user's wallet, which may cause a \u003cb>negative balance\u003c/b>."}, {"t": "\u003cb>Important\u003c/b>:", "c": [{"t": "The user's account \u003cb>cannot be reactivated until the outstanding amount is settled.\u003c/b>", "f": "b"}, {"t": "The disputed amount \u003cb>cannot be transferred to another account\u003c/b>.", "f": "b"}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Refund Request to a Bank Card or Digital Wallet", "c": [{"t": "Before processing the refund, verify that:", "c": [{"t": "Ask the user for the reason and assist with any related issue, if applicable.", "f": "b"}, {"t": "The user has a wallet balance equal to or greater than the refund amount.", "f": "b"}, {"t": "The original top-up transaction was made \u003cb>within the last 3 months\u003c/b>.", "f": "b"}, {"t": "We do not refund compensation amounts to the user's bank account or digital wallet.", "f": "b", "m": "o"}, {"t": "The refund is processed to the \u003cb>bank account linked to the card\u003c/b>, so an \u003cb>expired card does not affect the refund\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "\u003cb>1. User Does Not Have the Required Balance\u003c/b>", "h": 1, "c": [{"t": "Inform the user that a \u003cb>partial refund\u003c/b> can’t be processed.", "f": "b"}, {"t": "Advise the user to either:", "f": "b", "c": [{"t": "Use their wallet balance, or", "f": "b", "m": "o"}, {"t": "Top up the remaining amount until the wallet balance matches the original transaction amount.", "f": "b", "m": "o"}]}, {"t": "\u003cb>Note:\u003c/b> If the difference is \u003cb>5 EGP or less\u003c/b>, process the refund without asking the user to top up the remaining amount."}]}, {"t": "\u003cb>2. User Has the Required Balance, but More Than 3 Months Have Passed\u003c/b>", "h": 1, "c": [{"t": "Inform the user that the refund cannot be processed because the transaction is older than \u003cb>3 months\u003c/b>.", "f": "b"}, {"t": "Advise the user to use the available wallet balance for future rides.", "f": "b"}]}, {"t": "\u003cb>3. User Has the Required Balance and the Transaction Is Within 3 Months\u003c/b>", "h": 1, "c": [{"t": "Verify whether the original payment was made using a \u003cb>bank card\u003c/b> or a \u003cb>digital wallet\u003c/b>.", "f": "d"}, {"t": "\u003cb>If the payment was made by bank card:\u003c/b>", "f": "d", "h": 2, "c": [{"t": "Inform the user that the refund may take \u003cb>up to 14 working days\u003c/b>.", "f": "b", "m": "o"}, {"t": "If the user agrees, process the refund from the \u003cb>Bills\u003c/b> tab and deduct the refunded amount from the user's wallet balance.", "f": "b", "m": "o"}]}, {"t": "\u003cb>If the payment was made by digital wallet:\u003c/b>", "f": "d", "h": 2, "c": [{"t": "Inform the user that the refund may take \u003cb>up to 2 working days\u003c/b>.", "f": "b", "m": "o"}, {"t": "If the user agrees, process the refund from the \u003cb>Bills\u003c/b> tab and deduct the refunded amount from the user's wallet balance.", "f": "b", "m": "o"}, {"t": "\u003cb>Note:\u003c/b> If the refund will be processed across more than one transaction, confirm this with the user. If the transactions will be refunded to different cards, this must be clearly noted."}]}]}], "g": "general", "b": "Payments & Wallet"}, {"t": "Auto end warning", "c": [{"t": "\u003cb>Scooter Was Moving Slowly\u003c/b>", "h": 2, "c": [{"t": "Open the \u003cb>Ride Logs\u003c/b> for the ride.", "f": "b"}, {"t": "Check whether an \u003cb>Auto End Warning\u003c/b> was triggered.", "f": "b"}, {"t": "If an \u003cb>Auto End Warning\u003c/b> is found:", "f": "b", "c": [{"t": "Inform the user that the scooter's speed was automatically limited due to \u003cb>insufficient wallet balance\u003c/b>.", "f": "b", "m": "o"}, {"t": "Explain that once the balance is depleted, the scooter speed is reduced to \u003cb>5 km/h\u003c/b> for up to \u003cb>5 minutes\u003c/b>, allowing the user to safely end the ride.", "f": "b", "m": "o"}, {"t": "Inform the user that these \u003cb>5 minutes are chargeable\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "As a one-time exception, you may refund the \u003cb>Auto End Warning\u003c/b> charge. Ensure you leave a clear comment explaining the reason for the exception.", "f": "b"}, {"t": "If the \u003cb>negative balance was deducted from the user's card\u003c/b>, it is still \u003cb>eligible for a refund\u003c/b>; if the user requests a refund to their \u003cb>bank account\u003c/b>, proceed according to the refund process.", "f": "b"}]}]}], "g": "scooter", "b": "Scooter & Fines"}, {"t": "How to find/redeem a promo code", "c": [{"t": "\u003cb>Find Available Promo Codes\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "b"}, {"t": "Select \u003cb>Notifications\u003c/b> to view the available promo codes.", "f": "b"}]}, {"t": "\u003cb>Redeem a Promo Code\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b> and select \u003cb>Wallet\u003c/b>.", "f": "b"}, {"t": "Tap \u003cb>Add Code\u003c/b>.", "f": "b"}, {"t": "Enter the promo code and tap \u003cb>Save\u003c/b>.", "f": "b"}, {"t": "Scan the scooter's QR code.", "f": "b"}, {"t": "Tap \u003cb>Have a Promo Code\u003c/b>, select the saved promo code, then tap \u003cb>Apply\u003c/b> to activate it for the ride.", "f": "b"}, {"t": "Note: If the user saved a promo code but did not apply it to the ride and claims it was not used, check whether the promo code is still valid and eligible for the user. If it is still valid, educate the user that the promo code must be selected and applied before starting the ride."}]}], "g": "general", "b": "Promo Codes"}, {"t": "Not receiving a promo code", "c": [{"t": "\u003cb>Not Receiving Promo Code Notifications\u003c/b>", "h": 1, "c": [{"t": "Confirm with the user whether \u003cb>app notifications are enabled\u003c/b> in their device settings.", "f": "b"}, {"t": "\u003cb>If Notifications Are Enabled\u003c/b>", "h": 1, "c": [{"t": "Check the \u003cb>Promos\u003c/b> tab to verify whether the user is eligible for any active promo codes.", "f": "b"}, {"t": "If the user is eligible:", "f": "b", "c": [{"t": "Share the \u003cb>eligible promo code\u003c/b> with the user after confirming that it is still valid, and inform them of its \u003cb>conditions and expiration date\u003c/b>.", "f": "b", "m": "o"}, {"t": "Submit a \u003cb>form for escalation and investigation\u003c/b> to determine why the notification was not received.", "f": "b", "m": "o"}]}, {"t": "If the user is not eligible, handle the inquiry.", "f": "b"}]}, {"t": "\u003cb>If Notifications Are Disabled\u003c/b>", "h": 1, "c": [{"t": "Advise the user to enable \u003cb>app notifications\u003c/b> from their device settings to receive future promo code notifications.", "f": "b"}, {"t": "Check the \u003cb>Promos\u003c/b> tab to verify whether the user is eligible for any active promo codes.", "f": "b"}, {"t": "If the user is eligible, share the eligible promo code with the user.", "f": "b"}]}]}], "g": "general", "b": "Promo Codes"}, {"t": "Requesting a code/credit", "c": [{"t": "\u003cb>Requesting a Free Promo Code\u003c/b>", "h": 1, "c": [{"t": "Inform the user that Customer Support does not provide promo codes directly, but you will check whether they are eligible for any active promotions.", "f": "b"}, {"t": "Check the \u003cb>Promos\u003c/b> tab to verify the user's eligibility.", "f": "b"}, {"t": "If the user is eligible:", "f": "b", "c": [{"t": "Share the \u003cb>eligible promo code\u003c/b> with the user after confirming that it is still valid, and inform them of its \u003cb>conditions and expiration date\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "If the user is not eligible:", "f": "b", "c": [{"t": "Inform them that you have checked the available promotions, but they are not currently eligible for any promo codes.", "f": "b", "m": "o"}]}, {"t": "Educate the user on how to find future promo codes:", "f": "b", "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "b", "m": "o"}, {"t": "Select \u003cb>Notifications\u003c/b> to view available promo codes.", "f": "b", "m": "o"}]}, {"t": "Advise the user to follow our official social media channels to stay updated on the latest promotions.", "f": "b"}]}, {"t": "\u003cb>Requesting Free Balance\u003c/b>", "h": 1, "c": [{"t": "\u003cb>General Request\u003c/b>", "h": 1, "c": [{"t": "Inform the user that Customer Support does not provide free balance upon request.", "f": "b"}, {"t": "Educate the user on how to earn free balance:", "f": "b", "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "b", "m": "o"}, {"t": "Select \u003cb>Free Balance\u003c/b>.", "f": "b", "m": "o"}]}]}, {"t": "\u003cb>Requesting a Specific Amount to Start a Ride\u003c/b>", "h": 1, "c": [{"t": "If the user requests \u003cb>5 EGP or less\u003c/b> to start a ride, manually credit the requested amount as an \u003cb>exception, up to 2 times within the last 30 days\u003c/b>, even if the user's current balance is from \u003cb>compensation\u003c/b>.", "f": "b"}, {"t": "Inform the user that this is an exception to help them start their ride.", "f": "b"}]}]}], "g": "general", "b": "Promo Codes"}, {"t": "Inquiry About Receiving a Promo Code After Completing the Required Rides", "c": [{"t": "Verify that the user has met all the required promotion conditions.", "f": "b"}, {"t": "If the user is eligible, provide the promo code.", "f": "b"}, {"t": "If the user has not met all the required conditions, inform them of the remaining requirements needed to become eligible for the promo code.", "f": "b"}], "g": "general", "b": "Promo Codes"}, {"t": "Promo code conditions", "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "In the \u003cb>Dashboard\u003c/b>, navigate to \u003cb>Promo Codes\u003c/b>.", "f": "b"}, {"t": "Search for the promo code and review its terms and conditions.", "f": "b"}, {"t": "Explain the applicable conditions and eligibility requirements to the user.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b> If the user shares a screenshot of a promo code pop-up and requests clarification, follow the same process."}], "g": "general", "b": "Promo Codes"}, {"t": "Unable to Save a Promo Code", "c": [{"t": "\u003cb>The user is not eligible\u003c/b>", "h": 1, "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "If the user is unable to save a promo code, first verify whether they are eligible for the promotion.", "f": "b"}, {"t": "Check the \u003cb>Promos\u003c/b> tab to confirm whether the promo code was assigned to the user.", "f": "b", "c": [{"t": "If the promo code is \u003cb>not found\u003c/b>, inform the user that they are \u003cb>not eligible\u003c/b> for that promotion.", "f": "b", "m": "o"}]}, {"t": "If the user claims they received a promo code notification:", "f": "b", "c": [{"t": "Request a \u003cb>screen recording\u003c/b> showing the notification and the user’s number.", "f": "b", "m": "o"}]}, {"t": "Verify that the notification was sent to the \u003cb>same phone number\u003c/b> associated with the user's account.", "f": "b"}, {"t": "If the user \u003cb>is not eligible\u003c/b> but the screen recording confirms that the promo code notification was sent to the same phone number, compensate the user with an amount equal to the promo code value.", "f": "b"}]}, {"t": "\u003cb>Eligible User Unable to Save a Promo Code\u003c/b>", "h": 1, "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "Check the \u003cb>Promo tab\u003c/b> to identify the \u003cb>error message displayed\u003c/b> when attempting to save the promo code.", "f": "b"}, {"t": "Check the \u003cb>Promos tab\u003c/b> to verify that the promo code was assigned to the user.", "f": "b"}, {"t": "Check whether the same promo code exists on any \u003cb>linked\u003c/b> or \u003cb>deleted\u003c/b> accounts associated with the user.", "f": "b"}, {"t": "If all checks are clear, compensate the user with an amount equal to the promo code value.", "f": "b"}]}, {"t": "\u003cb>Promo Code Capacity Reached\u003c/b>", "h": 1, "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "Check the \u003cb>Promo tab\u003c/b> to identify the \u003cb>error message displayed\u003c/b> when attempting to save the promo code.", "f": "b"}, {"t": "In the \u003cb>Dashboard\u003c/b>, navigate to \u003cb>Promo Codes\u003c/b> and search for the promo code.", "f": "b"}, {"t": "Open the promo code details and compare the \u003cb>Capacity\u003c/b> with the \u003cb>Used\u003c/b> count.", "f": "b"}, {"t": "If the \u003cb>Used\u003c/b> count has reached the \u003cb>Capacity\u003c/b>, inform the user that the promo code has reached its maximum usage limit and can no longer be redeemed.", "f": "b"}]}, {"t": "\u003cb>Promo Code Already Redeemed\u003c/b>", "h": 1, "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "Check the \u003cb>Promo tab\u003c/b> to identify the \u003cb>error message displayed\u003c/b> when attempting to save the promo code.", "f": "b"}, {"t": "In the \u003cb>Dashboard\u003c/b>, open the \u003cb>User\u003c/b> page and check the \u003cb>Used Promo Codes\u003c/b> section.", "f": "b"}, {"t": "If the promo code has already been redeemed on the user's account:", "f": "b", "c": [{"t": "Inform the user that the promo code has already been used.", "f": "b", "m": "o"}, {"t": "Let them know when it was redeemed.", "f": "b", "m": "o"}]}, {"t": "If the promo code is not found on the user's account:", "f": "b"}, {"t": "Check the \u003cb>Promo tab\u003c/b> to identify the \u003cb>error message displayed\u003c/b> when attempting to save the promo code.", "f": "b"}, {"t": "If the promo code is found on a linked account:", "f": "b", "c": [{"t": "Inform the user which account redeemed the promo code.", "f": "b", "m": "o"}, {"t": "Explain that a promo code can only be redeemed \u003cb>once per device/linked accounts\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "If the user claims that a promo code was \u003cb>not activated\u003c/b>, follow the same process.", "f": "b"}, {"t": "Even if the related account has been \u003cb>unlinked\u003c/b>, the user can’t redeem the promo code normally.", "f": "b"}]}]}, {"t": "\u003cb>Promo Code Expired\u003c/b>", "h": 1, "c": [{"t": "Ask the user for the promo code if it has not been provided.", "f": "b"}, {"t": "Check the \u003cb>Promo tab\u003c/b> to identify the \u003cb>error message displayed\u003c/b> when attempting to save the promo code.", "f": "b"}, {"t": "In the \u003cb>Dashboard\u003c/b>, navigate to \u003cb>Promo Codes\u003c/b> and search for the promo code.", "f": "b"}, {"t": "Open the promo code details and check the \u003cb>Expiration Date\u003c/b>.", "f": "b"}, {"t": "If the promo code has expired, inform the user of the expiration date and explain that the promo code can no longer be redeemed.", "f": "b"}, {"t": "Note: The user may have entered the promo code incorrectly. Always verify the promo code entered before proceeding with further troubleshooting."}]}], "g": "general", "b": "Promo Codes"}, {"t": "Rabbit Prime", "c": [{"t": "\u003cb>Rabbit Prime\u003c/b> is a subscription that \u003cb>automatically renews\u003c/b> unless canceled.", "f": "b"}, {"t": "For \u003cb>79 EGP\u003c/b>, Prime members receive:", "f": "b", "c": [{"t": "\u003cb>Free scooter unlocking\u003c/b>.", "f": "b", "m": "o"}, {"t": "\u003cb>15 free scooter reservations\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "\u003cb>How to Subscribe to Rabbit Prime\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "d"}, {"t": "Select \u003cb>Prime Plan\u003c/b>.", "f": "d"}, {"t": "Tap \u003cb>Subscribe\u003c/b> and complete the payment to activate your Prime membership.", "f": "d"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "Prime subscriptions can only be purchased using a \u003cb>bank card\u003c/b>.", "f": "b"}, {"t": "New users have a \u003cb>7 days free trial\u003c/b>, available \u003cb>once per IP address\u003c/b>.", "f": "b"}]}]}, {"t": "\u003cb>How to Cancel a Prime Subscription\u003c/b>", "h": 1, "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "d"}, {"t": "Select \u003cb>Prime Plan\u003c/b>.", "f": "d"}, {"t": "Tap \u003cb>Unsubscribe\u003c/b> to cancel the automatic renewal of your Prime subscription.", "f": "d"}, {"t": "\u003cb>Note:\u003c/b> The subscription benefits remain active until the end of the current billing period."}]}], "g": "general", "b": "Rabbit Prime"}, {"t": "Prime Cancellation Request (Complaint)", "c": [{"t": "Ask the user for the reason they want to cancel the Prime subscription and explain the Prime benefits.", "f": "d"}, {"t": "Check the user's account to verify whether any Prime benefits have already been used.", "f": "d"}, {"t": "If the Prime benefits \u003cb>have been used\u003c/b>:", "f": "d", "c": [{"t": "Inform the user that the subscription \u003cb>cannot be canceled or refunded\u003c/b>.", "f": "b", "m": "o"}, {"t": "Offer to \u003cb>disable the automatic renewal\u003c/b> instead.", "f": "b", "m": "o"}]}, {"t": "If the Prime benefits \u003cb>have not been used\u003c/b>:", "f": "d", "c": [{"t": "Cancel the Prime subscription.", "f": "b", "m": "o"}, {"t": "Process a full refund for the subscription amount.", "f": "b", "m": "o"}]}, {"t": "Note:", "h": 1, "c": [{"t": "By default, the refund should be credited to the user's \u003cb>Rabbit wallet\u003c/b>. If the user requests the refund to their \u003cb>original bank card\u003c/b>, it can be processed accordingly.", "f": "b"}, {"t": "We can refund \u003cb>all unused subscriptions\u003c/b> to the user's wallet. If the user requests a refund to their \u003cb>bank account\u003c/b>, the subscription must not be older than \u003cb>3 months\u003c/b>.", "f": "b"}, {"t": "If the user has already used \u003cb>one unlock or reservation\u003c/b>, the subscription can still be refunded as an \u003cb>exception\u003c/b>.", "f": "b"}]}], "g": "general", "b": "Rabbit Prime"}, {"t": "New Area/ Expansion Request", "c": [{"t": "Ask the user to provide the following information if it has not been specified:", "f": "d", "c": [{"t": "The \u003cb>area name\u003c/b>.", "f": "b", "m": "o"}, {"t": "The \u003cb>street or specific location\u003c/b>, if available.", "f": "b", "m": "o"}, {"t": "A \u003cb>screenshot of the location\u003c/b> from \u003cb>Google Maps\u003c/b> or the \u003cb>Rabbit app map\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "Submit an \u003cb>Expansion requests\u003c/b> through the app.", "f": "d"}, {"t": "Inform the user that their request has been submitted and will be taken into consideration for future expansion.", "f": "d"}, {"t": "\u003cb>Note:\u003c/b> If the user is requesting an increase in the number of scooters in an existing area, handle the inquiry without submitting an area expansion request."}], "g": "general", "b": "Requests & Support"}, {"t": "Service Restricted Area Request", "c": [{"t": "Ask the user for the reason for the request in detail.", "f": "d"}, {"t": "If the reason is \u003cb>valid\u003c/b>:", "f": "d"}, {"t": "Ask the user to provide a \u003cb>screenshot of the restricted area from the app's map\u003c/b>.", "f": "b"}, {"t": "Ask the user to \u003cb>share their location\u003c/b>.", "f": "b"}, {"t": "Inform the user that the \u003cb>complaint has been raised\u003c/b>.", "f": "b"}, {"t": "\u003cb>Submit a ticket\u003c/b> with all the required details.", "f": "b"}], "g": "general", "b": "Requests & Support"}, {"t": "Map Zones", "c": [{"t": "Educate the user about the different map zones in the app:", "c": [{"t": "\u003cb>Green Zone:\u003c/b> You can ride and park the scooter freely.", "f": "b"}, {"t": "\u003cb>Red Zone:\u003c/b> You can ride within the zone, but you \u003cb>cannot end the ride or park the scooter\u003c/b> there.", "f": "b"}, {"t": "\u003cb>Grey Zone:\u003c/b> Riding and parking are \u003cb>not permitted\u003c/b> in this restricted area.", "f": "b"}]}, {"t": "Guide the user on how to use the map to locate the different zones before starting or ending a ride."}, {"t": "\u003cb>Note:\u003c/b> If the user asks about a specific street or area, check the map and provide the user with the available information."}], "g": "general", "b": "Ride Basics"}, {"t": "How to Verify Your Account", "c": [{"t": "Open the \u003cb>Side Menu\u003c/b>.", "f": "d"}, {"t": "Go to \u003cb>Your Profile\u003c/b>.", "f": "d"}, {"t": "Tap \u003cb>Verify\u003c/b>.", "f": "d"}, {"t": "Capture a clear photo of your identification document.", "f": "d"}, {"t": "Take a selfie to complete the verification process.", "f": "d"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "You can verify your account using a \u003cb>National ID\u003c/b>, \u003cb>Passport (including Egyptian passports)\u003c/b>, or \u003cb>Residence\u003c/b>.", "f": "b"}, {"t": "The main benefit of verifying your account is gaining access to \u003cb>Digital Wallet\u003c/b> as a payment method.", "f": "b"}, {"t": "If the user attempts to verify their account \u003cb>6 times in the same day\u003c/b> and all attempts are rejected, the account will be \u003cb>blocked\u003c/b>. The user can try to verify the account again after \u003cb>24 hours\u003c/b>.", "f": "b"}]}], "g": "general", "b": "Verification"}, {"t": "Pending ID Verification Request", "c": [{"t": "Open the \u003cb>User\u003c/b> page in the Dashboard.", "f": "d"}, {"t": "Navigate to the \u003cb>ID Verifications\u003c/b> tab.", "f": "d"}, {"t": "Click \u003cb>View Verification Status\u003c/b>.", "f": "d"}, {"t": "Review the submitted verification and ensure that:", "f": "d", "c": [{"t": "The selfie is clear and matches the ID photo.", "f": "b", "m": "o"}, {"t": "The ID number matches the one displayed in the Dashboard.", "f": "b", "m": "o"}, {"t": "The user is \u003cb>16 years old or older\u003c/b>.", "f": "b", "m": "o"}, {"t": "The ID is \u003cb>not expired\u003c/b>.", "f": "b", "m": "o"}, {"t": "The uploaded document is an \u003cb>original physical ID\u003c/b> (hard copy).", "f": "b", "m": "o"}]}, {"t": "If all validation checks are successful:", "f": "d", "c": [{"t": "Click \u003cb>Save\u003c/b> \u003cb>And\u003c/b> \u003cb>Accept\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "If any validation check fails:", "f": "d", "c": [{"t": "Click \u003cb>Decline\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "\u003cb>Notes:\u003c/b>", "h": 2, "c": [{"t": "If you click \u003cb>Save\u003c/b> \u003cb>And\u003c/b> \u003cb>Accept\u003c/b> but receive an error indicating that the \u003cb>ID is duplicated\u003c/b>, decline the verification request.", "f": "b"}, {"t": "For \u003cb>Passport\u003c/b> and \u003cb>Residence\u003c/b> verifications, click \u003cb>Accept Without Validation\u003c/b>.", "f": "b"}]}], "g": "general", "b": "Verification"}, {"t": "Rejected ID Verification Request", "c": [{"t": "Open the \u003cb>User\u003c/b> page in the Dashboard.", "f": "d"}, {"t": "Navigate to the \u003cb>ID Verifications\u003c/b> tab or \u003cb>ID Verification Transactions\u003c/b>.", "f": "d"}, {"t": "Review the rejection reason and inform the user accordingly.", "f": "d"}, {"t": "The verification request may be rejected for one of the following reasons:", "c": [{"t": "A \u003cb>copy\u003c/b> of the ID was submitted instead of the original physical ID.", "f": "b"}, {"t": "The ID numbers are \u003cb>unclear\u003c/b> or unreadable.", "f": "b"}, {"t": "The ID has \u003cb>expired\u003c/b>.", "f": "b"}, {"t": "The user completed \u003cb>OCR only\u003c/b> without completing the full verification process.", "f": "b"}, {"t": "\u003cb>Face Match\u003c/b> failed.", "f": "b"}, {"t": "The user is \u003cb>15 years old or younger\u003c/b>.", "f": "b"}]}, {"t": "Advise the user to submit a new verification request after correcting the identified issue.", "f": "d"}], "g": "general", "b": "Verification"}, {"t": "ID Verification Removal", "c": [{"t": "Ask the user for the reason for removing the ID verification.", "f": "d"}, {"t": "Check the user's account and history before proceeding.", "f": "d"}, {"t": "If the account is new and the reason is valid:", "h": 1, "c": [{"t": "Add the user's information to the \u003cb>ID Verification Form\u003c/b>, even if the ID was already removed by Leads via WhatsApp.", "f": "b"}, {"t": "Inform the user that the \u003cb>SLA for ID removal is 24 hours\u003c/b>.", "f": "b"}]}, {"t": "If the account is old:", "h": 1, "c": [{"t": "Check the user's \u003cb>ride history, related accounts, comments, and overall account history\u003c/b>.", "f": "b"}, {"t": "If the user has a bad history:", "h": 1, "c": [{"t": "(e.g., seeker, abuser, bad behavior, negative balance, multiple related accounts, or rides completed using \u003cb>promo codes\u003c/b>)", "f": "b"}, {"t": "Inform the user that, unfortunately, the ID \u003cb>cannot be removed once it has been registered on the account\u003c/b>.", "f": "b"}]}, {"t": "If the user has a good history:", "h": 1, "c": [{"t": "Add the user's \u003cb>phone number and ID details\u003c/b> to the \u003cb>ID Verification Form\u003c/b>, even if the ID was removed by Leads via WhatsApp.", "f": "b"}, {"t": "Inform the user that the \u003cb>SLA for ID removal is 24 hours\u003c/b>.", "f": "b"}]}]}, {"t": "Notes:", "h": 1, "c": [{"t": "If the user created an account, completed \u003cb>one or two rides using a promo code\u003c/b>, deleted the account, and then created a new account, the ID may be removed \u003cb>once as an exception\u003c/b>, with proper education provided to the user.", "f": "b"}, {"t": "The user should contact us from the \u003cb>account where the ID is registered\u003c/b>, or, if the account has been deleted, we can validate them through the chat and ask them to \u003cb>send a photo of the ID\u003c/b>.", "f": "b"}, {"t": "If the account linked to the ID has a \u003cb>negative balance\u003c/b>, a transfer may be required. First, confirm the solution with the user, make sure that he contacts us from the \u003cb>new account\u003c/b> so the transfer can be processed.", "f": "b"}]}], "g": "general", "b": "Verification"}, {"t": "Unable to Start a Ride", "c": [{"t": "Request a screenshot of the error message.", "f": "d"}, {"t": "If the error message is \u003cb>\"\u003c/b>Not Available\u003cb>\"\u003c/b>:", "f": "d", "c": [{"t": "Ask for the \u003cb>scooter code\u003c/b> if it has not been provided.", "f": "b", "m": "o"}, {"t": "In the \u003cb>Dashboard\u003c/b>, navigate to \u003cb>Assets\u003c/b> → \u003cb>Vehicle List\u003c/b> and search for the scooter.", "f": "b", "m": "o"}, {"t": "Check the scooter status:", "f": "b", "m": "o", "c": [{"t": "If the scooter is \u003cb>Inactive\u003c/b>, inform the user of the reason (e.g., low battery, disabled due to a technical issue, or weather restrictions).", "f": "b", "m": "s"}, {"t": "If the scooter is Reserved, inform the user that it is currently reserved by another user. They can:", "f": "b", "m": "s", "c": [{"t": "Wait until the reservation expires. If the other user does not start a ride, they can use the scooter.", "f": "b", "m": "s"}, {"t": "Find another available scooter nearby.", "f": "b", "m": "s"}]}]}]}, {"t": "If the error message indicates that the \u003cb>account is suspended\u003c/b>, open the \u003cb>User\u003c/b> page in the Dashboard and identify the reason for the suspension.", "f": "d"}, {"t": "Handle the case based on the suspension reason:", "f": "d"}, {"t": "Auto End Ride / Ended by Scooter", "h": 1, "c": [{"t": "Check whether the last ride was \u003cb>Auto Ended\u003c/b> or \u003cb>Ended by Scooter\u003c/b>.", "f": "b"}, {"t": "The account may remain suspended due to either an \u003cb>unpaid fine\u003c/b> or an \u003cb>unpaid negative balance\u003c/b>.", "f": "b"}, {"t": "If the \u003cb>fine has not yet been waived\u003c/b>, inform the user that they need to \u003cb>pay the fine\u003c/b> before the account can be reactivated.", "f": "b"}, {"t": "If the \u003cb>negative balance is unpaid\u003c/b>, inform the user that they need to \u003cb>settle the outstanding\u003c/b> balance before the account can be reactivated.", "f": "b"}, {"t": "If the \u003cb>fine has been waived\u003c/b>, the \u003cb>negative balance has been settled\u003c/b>, and there are no other suspension reasons, \u003cb>activate the account\u003c/b>.", "f": "b"}, {"t": "\u003cb>Note:\u003c/b>", "h": 2, "c": [{"t": "The user is \u003cb>not charged a fine for the first two successful rides with Auto End\u003c/b>.", "f": "b"}, {"t": "If the user's first ride was auto ended and they then started a new ride on the same scooter, waive the fine without asking the user for a photo.", "f": "b"}]}]}, {"t": "Negative Balance", "h": 1, "c": [{"t": "Inform the user that the ride ended normally, but the ride cost exceeded their wallet balance, resulting in a \u003cb>negative balance\u003c/b>.", "f": "b"}, {"t": "Advise the user to settle the negative balance. Once paid, the account will be activated.", "f": "b"}]}, {"t": "Behavior Comment", "h": 1, "c": [{"t": "If the suspension is due to a \u003cb>Team Leader (TL)\u003c/b> comment:", "f": "b", "c": [{"t": "Inform the user that the chat will be \u003cb>transferred\u003c/b> and the account will be reviewed shortly by the concerned team.", "f": "b", "m": "o"}, {"t": "Transfer the chat to \u003cb>Rabbit Mobility\u003c/b>.", "f": "b", "m": "o"}, {"t": "Leave a \u003cb>clear private note\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "If the comment was added by the \u003cb>Live Ops\u003c/b> team:", "f": "b", "c": [{"t": "Refer the case to the \u003cb>TL\u003c/b> to confirm whether the account should be reactivated.", "f": "b", "m": "o"}]}]}, {"t": "Suspected Abuser / Linked to Abuser Account", "h": 1, "c": [{"t": "If the user's account is linked to an abuser account, or you suspect the user is an abuser:", "c": [{"t": "Handle the user's inquiry normally and activate the account if eligible.", "f": "d"}, {"t": "Click \u003cb>“Is Smart Customer”\u003c/b> in Freshchat.", "f": "d"}, {"t": "Submit the \u003cb>Blocked User Form\u003c/b>.", "f": "d"}]}]}, {"t": "Linked Accounts", "h": 1, "c": [{"t": "Check all linked accounts.", "f": "b"}, {"t": "If \u003cb>none\u003c/b> of the linked accounts have a negative balance, \u003cb>activate the account\u003c/b>.", "f": "b"}, {"t": "If a linked account has a \u003cb>negative balance\u003c/b>:", "f": "b", "c": [{"t": "Inform the user that the outstanding balance must be settled before the account can be activated.", "f": "b", "m": "o"}, {"t": "Offer to \u003cb>transfer the negative balance\u003c/b> to the user's current account.", "f": "b", "m": "o"}, {"t": "If the user claims that the linked account does \u003cb>not\u003c/b> belong to them and refuses to pay, review the following:", "f": "b", "m": "o", "c": [{"t": "If the user has \u003cb>more than three linked accounts with different names\u003c/b>, they must settle the balance before activation.", "f": "d"}, {"t": "If the negative balance is from \u003cb>2024 or earlier\u003c/b>, you may \u003cb>unlink the account as a one-time exception\u003c/b>, then educate the user.", "f": "d"}, {"t": "If the negative balance is from \u003cb>2025\u003c/b> and is \u003cb>due to a fine\u003c/b>, you may \u003cb>unlink the account as a one-time exception\u003c/b>, then educate the user.", "f": "d"}, {"t": "If all checks are clear, \u003cb>activate the account\u003c/b>.", "f": "d"}]}]}, {"t": "\u003cb>Notes:\u003c/b>", "h": 2, "c": [{"t": "Always inform the user of the \u003cb>reason\u003c/b> for the account suspension.", "f": "b"}, {"t": "If the last ride was \u003cb>Auto Ended\u003c/b> and the account is still suspended, the suspension is \u003cb>not related to the ride\u003c/b>, as the account should have been reactivated automatically after the fine was waived. Check for another suspension reason.", "f": "b"}]}, {"t": "Unlink Related Accounts", "h": 1, "c": [{"t": "\u003cb>Check the comments first\u003c/b> to confirm whether the accounts were already unlinked. If they were previously delinked, \u003cb>do not unlink them again\u003c/b>.", "f": "b"}, {"t": "If there is no related comment, check the user's \u003cb>related accounts\u003c/b>. The user can have a maximum of \u003cb>3 related accounts\u003c/b>, with different account data.", "f": "b"}, {"t": "\u003cb>Notes:\u003c/b>", "h": 2, "c": [{"t": "\u003cb>Do not unlink any deleted accounts.\u003c/b>", "f": "b", "m": "o"}, {"t": "Adding a \u003cb>comment is mandatory on both accounts\u003c/b> after unlinking.", "f": "b", "m": "o"}]}]}]}], "g": "general", "b": "Account & App"}, {"t": "Can’t start a ride (Lock issue)", "c": [{"t": "During the Ride", "h": 1, "c": [{"t": "From the \u003cb>User\u003c/b> page, select the active vehicle and click \u003cb>Force Unlock\u003c/b>.", "f": "d", "c": [{"t": "If it works:", "f": "b", "m": "o", "c": [{"t": "Submit a \u003cb>Live Ops\u003c/b> ticket, including the \u003cb>full case details\u003c/b>.", "f": "b", "m": "s"}, {"t": "Refund the wasted ride time.", "f": "b", "m": "s"}, {"t": "Compensate the user.", "f": "b", "m": "s"}, {"t": "Educate the user on how to unlock the scooter correctly.", "f": "b", "m": "s"}, {"t": "If it does not work, proceed to the next step.", "f": "b", "m": "o"}]}]}, {"t": "Click \u003cb>Restart\u003c/b>.", "f": "d", "c": [{"t": "If it works:", "f": "b", "m": "o", "c": [{"t": "Submit a \u003cb>Live Ops\u003c/b> ticket, including the \u003cb>full case details\u003c/b>.", "f": "b", "m": "s"}, {"t": "Refund the wasted ride time.", "f": "b", "m": "s"}, {"t": "Compensate the user.", "f": "b", "m": "s"}, {"t": "Educate the user.", "f": "b", "m": "s"}]}, {"t": "If it does not work, proceed to the next step.", "f": "b", "m": "o"}]}, {"t": "Ask the user to send a \u003cb>clear photo of the scooter while it is locked\u003c/b>.", "f": "d", "c": [{"t": "From \u003cb>Ride Logs\u003c/b>, end the ride \u003cb>free of charge\u003c/b>.", "f": "b", "m": "o"}, {"t": "Attach the user's photo.", "f": "b", "m": "o"}, {"t": "Check the app first. If it is the \u003cb>second issue of the same type\u003c/b>, disable the scooter. If it is the \u003cb>third issue of a different type\u003c/b>, disable the scooter as well.", "f": "b", "m": "o"}, {"t": "Submit a \u003cb>Live Ops\u003c/b> ticket, including the \u003cb>full case details\u003c/b>.", "f": "b", "m": "o"}, {"t": "If the ride was ended by the scooter, \u003cb>waive the fine\u003c/b>. Keep in mind that each user has \u003cb>one exception\u003c/b> available for this case. If the exception is used, \u003cb>educate the user on the correct procedure.\u003c/b>", "f": "b", "m": "o"}, {"t": "Compensate the user.", "f": "b", "m": "o"}, {"t": "If the scooter was \u003cb>reserved\u003c/b>, refund the \u003cb>reservation amount\u003c/b>.", "f": "b", "m": "o"}]}]}, {"t": "After the Ride Has Ended", "h": 1, "c": [{"t": "\u003cb>Scenario 1: The user did not use the scooter at all (ride duration is 3 minutes or less).\u003c/b>", "h": 1, "c": [{"t": "Check the app first. If it is the \u003cb>second issue of the same type\u003c/b>, disable the scooter. If it ": 1, "c": [{"t": "If the user takes time to end the ride, \u003cb>this is not considered a scooter issue\u003c/b>."}, {"t": "A refund can be granted for \u003cb>up to 2 exceptions within the user's last 10 rides.\u003c/b>", "f": "b"}, {"t": "\u003cb>Educate the user\u003c/b> on the correct ride ending process.", "f": "b"}, {"t": "A \u003cb>mandatory comment\u003c/b> must be added: \u003cb>“Ride Ending Education Exception”\u003c/b>.", "f": "b"}, {"t": "Select \u003cb>“Other”\u003c/b> as the refund reason.", "f": "b"}]}, {"t": "Reupload Image", "h": 1, "c": [{"t": "Ask the user if they have a clear photo of the scooter properly locked around a pole or tree.", "f": "d"}, {"t": "If the user has a suitable photo, take the photo and attach it to the ride.", "f": "d"}, {"t": "If the user does not have a suitable photo, educate them on how to take a clear photo of the scooter properly locked for future rides.", "f": "d"}]}], "g": "scooter", "b": "Scooter & Fines"}, {"t": "Scooter issues", "c": [{"t": "There are \u003cb>two types of issues\u003c/b>:"}, {"t": "Type 1: Non-Critical Scooter Issues", "h": 1, "c": [{"t": "If the user complains about any of the following:", "c": [{"t": "Flashlight", "f": "b"}, {"t": "Handle", "f": "b"}, {"t": "Vibrating", "f": "b"}, {"t": "Flap", "f": "b"}, {"t": "Mobile holder", "f": "b"}, {"t": "Bell", "f": "b"}, {"t": "Signs", "f": "b"}, {"t": "Kickstand", "f": "b"}]}, {"t": "\u003cb>Process:\u003c/b>", "h": 2, "c": [{"t": "Handle the user's inquiry normally.", "f": "b"}, {"t": "If the user has a \u003cb>good history\u003c/b>, send the \u003cb>full case details to the TL\u003c/b> for compensation approval, and ensure there is a \u003cb>clear comment documenting the case and the approval, including who approved it\u003c/b>.", "f": "b"}, {"t": "Submit a \u003cb>Live Ops\u003c/b> ticket.", "f": "b"}]}]}, {"t": "Type 2: Critical Scooter Issues", "h": 1, "c": [{"t": "If the user complains about any of the following:", "c": [{"t": "Throttle", "f": "b"}, {"t": "Scooter not moving", "f": "b"}, {"t": "Scooter not stable", "f": "b"}, {"t": "Scooter stopped suddenly", "f": "b"}, {"t": "Tires", "f": "b"}, {"t": "Brakes", "f": "b"}, {"t": "Low speed", "f": "b"}, {"t": "Low battery", "f": "b"}]}, {"t": "\u003cb>Process:\u003c/b>", "h": 2, "c": [{"t": "The user is eligible for \u003cb>3 full refunds and compensations per week\u003c/b> (Sunday–Saturday).", "f": "b"}, {"t": "If the scooter was \u003cb>reserved\u003c/b>, refund the \u003cb>reservation amount\u003c/b>.", "f": "b"}, {"t": "Check the app first. If it is the \u003cb>second issue of the same type\u003c/b>, disable the scooter. If it is the \u003cb>third issue of a different type\u003c/b>, disable the scooter as well, \u003cb>except in low battery/speed cases\u003c/b>.", "f": "b"}, {"t": "Submit a \u003cb>Live Ops\u003c/b> ticket, \u003cb>except in low battery cases\u003c/b>.", "f": "b"}, {"t": "Starting from the \u003cb>4th complaint\u003c/b>, check the scooter's history before processing any refund or compensation.", "f": "b"}]}, {"t": "\u003cb>How to check the scooter history:\u003c/b>", "h": 2, "c": [{"t": "Verify that the \u003cb>rides duration on the same day is more than 3 minutes\u003c/b>.", "f": "d"}, {"t": "Check \u003cb>Ride Issue Reports\u003c/b> under the ride in the \u003cb>Dashboard\u003c/b>.", "f": "d"}, {"t": "Check the \u003cb>Ops app\u003c/b>.", "f": "d"}, {"t": "Check the \u003cb>maintenance records\u003c/b> from the \u003cb>Vehicle page\u003c/b>.", "f": "d"}, {"t": "If an issue is found in any of the above checks:", "f": "b", "c": [{"t": "Refund the user.", "f": "b", "m": "o"}, {"t": "Compensate the user.", "f": "b", "m": "o"}, {"t": "If the scooter was \u003cb>reserved\u003c/b>, refund the \u003cb>reservation amount\u003c/b>.", "f": "b", "m": "o"}, {"t": "A \u003cb>mandatory comment\u003c/b> must be added.", "f": "b", "m": "o"}]}, {"t": "If the \u003cb>same issue is reported twice on the same day\u003c/b>, or \u003cb>3 different issues\u003c/b> are reported on the same scooter on the same day:", "f": "b", "c": [{"t": "\u003cb>Disable the scooter\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "Submit a \u003cb>Live Ops\u003c/b> ticket.", "f": "b"}]}]}, {"t": "Unlock was opened without a ride", "h": 1, "c": [{"t": "Ask the user for the \u003cb>scooter code\u003c/b>.", "f": "d"}, {"t": "\u003cb>Disable the scooter\u003c/b>.", "f": "d"}, {"t": "Submit a \u003cb>Live Ops ticket\u003c/b>.", "f": "d"}]}], "g": "scooter", "b": "Scooter & Fines"}, {"t": "FYI", "nn": 0, "c": [{"t": "Rides &amp; Scooters", "h": 1, "c": [{"t": "Each account is allowed to initiate only one active ride at a time.", "f": "b"}, {"t": "There are three scooter models available: Navee, Yimi, and Kuickwheel ; this information is for internal use only and should not be shared with users.", "f": "b"}, {"t": "Maximum Speed: 25 km/h.", "f": "b"}, {"t": "Maximum Rider Weight: 120 kg.", "f": "b"}, {"t": "The ride must be \u003cb>30 seconds or more\u003c/b> to be counted as a \u003cb>successful ride\u003c/b>.", "f": "b"}, {"t": "Each area has \u003cb>two scooter manufacturers\u003c/b>.", "f": "b"}]}, {"t": "Internal Teams", "h": 1, "c": [{"t": "Battery charging is handled by a dedicated internal team. This process is confidential.", "f": "b"}, {"t": "Theft and accident cases are handled by a dedicated specialized team and are not managed through Customer Support.", "f": "b"}]}, {"t": "Wallet &amp; Cards", "h": 1, "c": [{"t": "\u003cb>Wallet top-up limit:\u003c/b> Up to \u003cb>EGP 2,000\u003c/b> from the user's side, and up to \u003cb>EGP 1,000\u003c/b> for wallet deductions or additions by the customer support.", "f": "b"}, {"t": "If the card is added through \u003cb>Paymob\u003c/b>, an OTP may or may not be required, depending on the bank’s policies.", "f": "b"}, {"t": "If the user has a \u003cb>negative balance\u003c/b> that has not been settled, the system will retry the payment \u003cb>5 days after the first attempt\u003c/b>, then \u003cb>once every day\u003c/b> afterward.", "f": "b"}, {"t": "The user can add the \u003cb>same card to a maximum of 3 accounts\u003c/b>.", "f": "b"}]}, {"t": "Promo Codes", "h": 1, "c": [{"t": "Only one promo code can be applied per ride.", "f": "b"}, {"t": "WE Points promo codes are valid for \u003cb>Rabbit Mart\u003c/b> only and are not applicable to \u003cb>Rabbit Mobility\u003c/b>", "f": "b"}, {"t": "Even if the user has a promo code, they must still add \u003cb>sufficient balance\u003c/b> to their wallet before starting the ride to prevent the ride from being automatically stopped due to insufficient funds. \u003cb>However, if the user starts a ride using a percentage based promo code without sufficient balance, the negative balance may be removed as a one time exception, with proper user education.\u003c/b>", "f": "b"}, {"t": "If the user reports a ride issue while using a promo code, refund the code amount only for free minutes or free amount codes; for percentage based codes, refund the deducted amount plus the promo code amount, also add the exact Pro scooter rate and unlock fee to the refund.", "f": "b"}]}, {"t": "Partnerships, Jobs &amp; Marketing", "h": 1, "c": [{"t": "We do not sell scooters or accept privately owned scooters to rent out in exchange for a share of the revenue.", "f": "b"}, {"t": "If a user is interested in partnering with us, direct them to send their partnership details to \u003ca href=\"mailto:contact@rabbit-app.com\" target=\"_blank\" rel=\"noopener\">\u003cb>contact@rabbit-app.com\u003c/b>\u003c/a>.", "f": "b"}, {"t": "If a user would like to apply for a job, advise them to follow our LinkedIn page for open positions or send their CV to \u003ca href=\"mailto:contact@rabbit-app.com\" target=\"_blank\" rel=\"noopener\">\u003cb>contact@rabbit-app.com\u003c/b>\u003c/a>.", "f": "b"}, {"t": "Scooter rentals are \u003cb>not currently available\u003c/b>.", "f": "b"}, {"t": "If the Marketing team publishes an engagement post and the user replies with a simple acknowledgment (e.g., “I know how to do it”), do not handle the case; close it directly. However, if the user asks a question or requests information, respond and handle the case as usual.", "f": "b"}]}], "g": "general", "b": "Requests & Support"}, {"t": "QA tips", "nn": 0, "c": [{"t": "Chats &amp; Escalation", "h": 1, "c": [{"t": "\u003cb>Spam Chats\u003c/b>", "f": "b", "c": [{"t": "If the user does not mention any issue and remains idle, send a greeting:", "f": "d", "c": [{"t": "\"Hello!", "f": "b", "m": "o"}, {"t": "How may I help you?\"", "f": "b", "m": "o"}]}, {"t": "If there is no response after 3 minutes, send the Since script.", "f": "d"}, {"t": "Before treating the conversation as spam, always check for:", "f": "d", "c": [{"t": "Any previous chats with the user.", "f": "b", "m": "o"}]}, {"t": "If a previous chat or complaint is found, follow the standard support flow instead of handling the conversation as spam.", "f": "d"}]}, {"t": "If the same user contacts the same agent, and the previous conversation was \u003cb>resolved within the last 10 minutes\u003c/b>, the agent may \u003cb>skip the greeting\u003c/b> and continue assisting the user.", "f": "b"}, {"t": "If a chat is disconnected from another agent, \u003cb>do not transfer it back unless you have confirmed that the agent is online and ready to handle it\u003c/b>.", "f": "b"}, {"t": "If a chat is received from a \u003cb>Rabbit employee\u003c/b> or someone who \u003cb>previously worked for Rabbit\u003c/b>, do not take any action. \u003cb>Assign the chat to the Rabbit account\u003c/b>.", "f": "b"}, {"t": "If the user has submitted \u003cb>two consecutive DSATs on the same day\u003c/b>, handle the user's inquiry according to the standard support process, then transfer the chat to the \u003cb>Rabbit\u003c/b> account after resolving the issue.", "f": "b"}, {"t": "If the user reports \u003cb>two issues in the same chat\u003c/b>, label the chat based on the \u003cb>more severe issue\u003c/b>.", "f": "b"}, {"t": "If the user has an issue and the necessary guidance has been provided, always follow up with the user in the chat to confirm that the resolution has successfully solved their issue before ending the conversation.", "f": "b"}]}, {"t": "Calls &amp; Language", "h": 1, "c": [{"t": "\u003cb>Calling a Customer\u003c/b>", "f": "b", "c": [{"t": "Ask the user if they are available to receive a call.", "f": "d"}, {"t": "If the user agrees, inform them:", "f": "d", "c": [{"t": "\"I will contact you right now.\"", "f": "b", "m": "o"}]}, {"t": "After completing the call, post a summary of the call in the chat conversation (do not add it as a private note).", "f": "d"}, {"t": "Send the appropriate closure message.", "f": "d"}]}, {"t": "\u003cb>Handling Aggressive Language\u003c/b>", "f": "b", "c": [{"t": "If the user uses \u003cb>extreme or abusive language\u003c/b> directed at the agent or the company:", "f": "d", "c": [{"t": "Do \u003cb>not\u003c/b> reply.", "f": "b", "m": "o"}, {"t": "Assign the chat to \u003cb>Rabbit\u003c/b>.", "f": "b", "m": "o"}, {"t": "Inform the \u003cb>Team Leader\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "If the user uses \u003cb>inappropriate language\u003c/b> that does not reach the level of extreme abuse:", "f": "d", "c": [{"t": "Send the appropriate \u003cb>warning message\u003c/b>.", "f": "b", "m": "o"}]}]}]}, {"t": "Exceptions, Fines &amp; Compensation", "h": 1, "c": [{"t": "Any exception must have a \u003cb>clear comment\u003c/b> documenting the reason and approval, if the issue is \u003cb>resolved without an exception\u003c/b>, leave a \u003cb>correction comment.\u003c/b>", "f": "b"}, {"t": "If the user was fined by Ops because the \u003cb>scooter locked on its own\u003c/b> or the \u003cb>ride end photo was unclear\u003c/b>:", "f": "b", "c": [{"t": "If it is the user's \u003cb>first occurrence\u003c/b>, waive the fine as a \u003cb>one-time exception\u003c/b> and educate the user on the correct procedure.", "f": "b", "m": "o"}, {"t": "If it is a \u003cb>repeated occurrence\u003c/b>, refer back to the \u003cb>Team Leader (TL)\u003c/b>.", "f": "b", "m": "o"}]}, {"t": "If the user provides a \u003cb>photo for an auto-ended ride on their own\u003c/b>, there is \u003cb>no need to provide education\u003c/b>.", "f": "b"}, {"t": "If the user has \u003cb>two complaints\u003c/b> and is eligible for compensation for both, provide the \u003cb>higher compensation amount only\u003c/b>.", "f": "b"}, {"t": "Keep in mind that a user who has completed \u003cb>only one ride\u003c/b> should be considered to have a \u003cb>good history\u003c/b>.", "f": "b"}, {"t": "If the user complains that \u003cb>all of their rides have issues\u003c/b>, refer the case to your \u003cb>TL\u003c/b> for further review.", "f": "b"}, {"t": "Whenever the user contacts us regarding an old ride, validate the case and take the necessary action.", "f": "b"}]}, {"t": "Feedback &amp; Complaints", "h": 1, "c": [{"t": "If the user leaves \u003cb>negative feedback\u003c/b>, handle the reported issue following the \u003cb>standard support process\u003c/b>.", "f": "b"}, {"t": "Handle price complaints according to the standard process. If the user does not understand the fare calculation, educate them on how the ride price was calculated.", "f": "b"}, {"t": "Comments and mentions on social media are \u003cb>out of Customer Support's scope.\u003c/b>", "f": "b"}, {"t": "If the user suggests any \u003cb>idea or solution\u003c/b>, make sure to \u003cb>fill out the form\u003c/b>.", "f": "b"}]}, {"t": "Accounts &amp; Data", "h": 1, "c": [{"t": "The \u003cb>scooter code is mandatory for all issues\u003c/b>; if there is more than one scooter, separate the codes using \u003cb>“-” with no spaces\u003c/b>.", "f": "b"}, {"t": "We do not provide the user with \u003cb>any personal or account data\u003c/b>.", "f": "b"}, {"t": "If the correct account is not found by \u003cb>phone number\u003c/b>, search by \u003cb>email address\u003c/b> before asking the user for
